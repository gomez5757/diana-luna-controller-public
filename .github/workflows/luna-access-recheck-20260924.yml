name: Luna authorized Codespace access recheck
on:
  push:
    branches: [main]
    paths: [.github/workflows/luna-access-recheck-20260924.yml]
permissions:
  contents: read
concurrency:
  group: diana-lifecycle-preflight
  cancel-in-progress: false
jobs:
  access:
    if: github.repository == 'gomez5757/diana-luna-controller-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Recheck previously denied endpoint without printing credentials
        env:
          GH_TOKEN: ${{ secrets.DIANA_CODESPACE_LIFECYCLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request,urllib.error
          name='diana-luna-secure-auth-pjxq7jrj7xpwfrpjx'
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs):
                  raise RuntimeError('REDIRECT_REJECTED')
          token=os.environ.get('GH_TOKEN','')
          if not token: raise SystemExit('LIFECYCLE_SECRET_MISSING')
          url='https://api.github.com/user/codespaces/'+name+'?internal=true&refresh=true'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','User-Agent':'diana-access-recheck/1'})
          try:
              with urllib.request.build_opener(NoRedirect).open(request,timeout=25) as response:
                  raw=response.read(262145)
                  if len(raw)>262144: raise SystemExit('RESPONSE_TOO_LARGE')
                  data=json.loads(raw)
                  if data.get('name')!=name or (data.get('repository') or {}).get('full_name')!='gomez5757/diana-plus':
                      raise SystemExit('CODESPACE_IDENTITY_MISMATCH')
                  print(json.dumps({'stage':'codespace-details','http_status':response.status,'state':data.get('state'),'identity_verified':True}))
          except urllib.error.HTTPError as error:
              print(json.dumps({'stage':'codespace-details','http_status':error.code,'accepted_permissions':error.headers.get('X-Accepted-GitHub-Permissions'),'status':'BLOCKED'}))
              raise SystemExit(2)
          PY
      - name: Start the one existing Codespace
        env:
          DIANA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.DIANA_CODESPACE_LIFECYCLE_TOKEN }}
        run: python3 -c "import controller; print({'start_request': controller.api_post('start')})"
      - name: Verify authorized SSH with a fixed no-op command
        env:
          GH_TOKEN: ${{ secrets.DIANA_CODESPACE_LIFECYCLE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=10s 180s gh codespace ssh -c diana-luna-secure-auth-pjxq7jrj7xpwfrpjx -- 'printf "LUNA_SSH_ACCESS_OK\n"'
      - name: Confirm provider shutdown even after a failed check
        if: always()
        env:
          DIANA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.DIANA_CODESPACE_LIFECYCLE_TOKEN }}
        run: python3 controller.py --stop
