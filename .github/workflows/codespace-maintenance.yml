name: Diana bounded Codespace maintenance
on:
  push:
    branches: [main]
    paths: [control/maintenance.json]
permissions:
  contents: read
concurrency:
  group: diana-codespace-maintenance
  cancel-in-progress: false
jobs:
  maintenance:
    if: github.repository == 'gomez5757/diana-luna-controller-public' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - id: request
        name: Validate bounded pulse request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          from pathlib import Path
          p=Path('control/maintenance.json')
          if p.is_symlink() or not p.is_file() or p.stat().st_size>2048:
              raise SystemExit('invalid maintenance file')
          d=json.loads(p.read_text())
          if type(d) is not dict or set(d)!={'schema','action','nonce'}:
              raise SystemExit('invalid maintenance fields')
          if d['schema']!=1 or d['action'] not in {'sync','upgrade'}:
              raise SystemExit('invalid maintenance action')
          if re.fullmatch(r'[a-f0-9]{32}',str(d['nonce'])) is None:
              raise SystemExit('invalid nonce')
          print('action='+d['action'])
          print('lease_seconds='+('90' if d['action']=='sync' else '900'))
          PY
      - name: Start exact existing Codespace and hold bounded lease
        env:
          GH_TOKEN: ${{ secrets.DIANA_CODESPACE_LIFECYCLE_TOKEN }}
          LEASE_SECONDS: ${{ steps.request.outputs.lease_seconds }}
        shell: bash
        run: |
          set -euo pipefail
          gh api -X POST /user/codespaces/diana-luna-secure-auth-pjxq7jrj7xpwfrpjx/start >/dev/null
          sleep "$LEASE_SECONDS"
      - name: Confirm shutdown even after failure
        if: always()
        env:
          DIANA_CODESPACE_LIFECYCLE_TOKEN: ${{ secrets.DIANA_CODESPACE_LIFECYCLE_TOKEN }}
        run: python3 controller.py --stop